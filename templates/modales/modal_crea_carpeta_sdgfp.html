<!-- templates/modales/modal_crea_folder.html -->
<div class="modal fade" id="modalCreaCarpetaSDGFP" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formCreaCarpetaSDGFP" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title">Crear carpeta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label for="codigoInput1" class="form-label">Código</label>
                        <input type="text" class="form-control" id="codigoInput1" maxlength="11"
                            placeholder="Ej: 26FP36CF567" required>
                        <div class="invalid-feedback" id="codigoError1">Formato inválido. Debe ser:
                            2números+2letras+2números+2letras+3números.</div>
                    </div>

                    <div class="mb-3">
                        <label for="asesorSelect1" class="form-label">Asesor</label>
                        <select id="asesorSelect1" class="form-select" required></select>
                        <div class="invalid-feedback" id="asesorError1">Seleccione un asesor.</div>
                    </div>

                    <div id="submitError1" class="alert alert-danger d-none" role="alert"></div>
                    <div id="submitSuccess1" class="alert alert-success d-none" role="alert"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Crear</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Axios CDN (si no está ya cargado en la plantilla base) -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
    (function () {
        const asesores = ["ALFREDO", "GLORIA", "PACO", "VERA", "GEMMA", "CAMILO", "SANTIAGO", "ANNA", "LOURDES", "LORENA", "PATRICIA", "JOSE", "DAVID", "IGNASI"];
        const asesorSelect1 = document.getElementById('asesorSelect1');
        const codigoInput1 = document.getElementById('codigoInput1');
        const form = document.getElementById('formCreaCarpetaSDGFP');
        const codigoError1 = document.getElementById('codigoError1');
        const asesorError1 = document.getElementById('asesorError1');
        const submitError1 = document.getElementById('submitError1');
        const submitSuccess1 = document.getElementById('submitSuccess1');

        // Poblar select
        asesores.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a;
            opt.textContent = a;
            asesorSelect1.appendChild(opt);
        });

        // Validación: 2números+2letras+2números+2letras+3números
        function validaCodigo(v) {
            v = (v || '').toUpperCase();
            return /^[0-9]{2}[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{3}$/.test(v);
        }

        // Convertir a mayúsculas al escribir
        codigoInput1.addEventListener('input', () => {
            const pos = codigoInput1.selectionStart;
            codigoInput1.value = codigoInput1.value.toUpperCase();
            codigoInput1.setSelectionRange(pos, pos);
            codigoInput1.classList.remove('is-invalid');
            submitError1.classList.add('d-none');
            submitSuccess1.classList.add('d-none');
        });

        asesorSelect1.addEventListener('change', () => {
            asesorSelect1.classList.remove('is-invalid');
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            submitError1.classList.add('d-none');
            submitSuccess1.classList.add('d-none');

            const codigo = codigoInput1.value.trim().toUpperCase();
            const asesor = asesorSelect1.value;

            let ok = true;
            if (!validaCodigo(codigo)) {
                codigoInput1.classList.add('is-invalid');
                ok = false;
            } else {
                codigoInput1.classList.remove('is-invalid');
            }

            if (!asesor) {
                asesorSelect1.classList.add('is-invalid');
                ok = false;
            } else {
                asesorSelect1.classList.remove('is-invalid');
            }

            if (!ok) return;

            // Petición axios a /create_folder
            axios.post('/create_folder_sdgfp', { codigo: codigo, asesor: asesor })
                .then(resp => {
                    submitSuccess1.textContent = resp.data && resp.data.message ? resp.data.message : 'Carpeta creada correctamente.';

                    submitSuccess1.classList.remove('d-none');
                    // intenta descargar si la respuesta ya trae el fichero (blob/arraybuffer)
                    function downloadFromResponse(res) {
                        const isArrayBuffer = res.data instanceof ArrayBuffer;
                        const isBlob = typeof Blob !== 'undefined' && res.data instanceof Blob;
                        if (!isArrayBuffer && !isBlob) return false;

                        const blob = isArrayBuffer ? new Blob([res.data], { type: (res.headers && res.headers['content-type']) || 'application/zip' }) : res.data;
                        let filename = `${codigo}.zip`;
                        const disp = res.headers && (res.headers['content-disposition'] || res.headers['Content-Disposition']);
                        if (disp) {
                            const m = /filename\*?=(?:UTF-8'')?["']?([^;"']+)/i.exec(disp);
                            if (m && m[1]) filename = decodeURIComponent(m[1].replace(/["']/g, ''));
                        }
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                        return true;
                    }

                    if (!downloadFromResponse(resp)) {
                        // si la primera respuesta no es el blob, re-solicita con responseType 'blob' y descarga
                        axios.post('/create_folder_sdgfp', { codigo: codigo, asesor: asesor }, { responseType: 'blob' })
                            .then(r2 => downloadFromResponse(r2) || (function () {
                                submitError1.textContent = 'No se recibió el fichero para descargar.';
                                submitError1.classList.remove('d-none');
                            })())
                            .catch(() => {
                                submitError1.textContent = 'Error al descargar el fichero.';
                                submitError1.classList.remove('d-none');
                            });
                    }
                    // opcional: cerrar modal después de un rato
                    setTimeout(() => {
                        const modalEl = document.getElementById('modalCreaCarpetaSdgfp');
                        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                        modal.hide();
                    }, 1000);
                })
                .catch(err => {
                    const msg = err.response && err.response.data && err.response.data.message
                        ? err.response.data.message
                        : 'Error al crear la carpeta.';
                    submitError1.textContent = msg;
                    submitError1.classList.remove('d-none');
                });
        });
    })();
</script>
