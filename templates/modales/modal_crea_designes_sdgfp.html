<style>
  #dropzone2 {
    border: 2px dashed #6c757d;
    border-radius: .5rem;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
  }

  #dropzone2.dragover {
    background: rgba(0, 0, 0, 0.03);
    border-color: #0d6efd;
  }

  #file-name {
    margin-top: .5rem;
    font-weight: 500;
  }
</style>


<div class="modal fade" id="modalCreaDesignesSdgfp" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crea_Designa per a la SDG de Formació del professorat</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="dropzone2">
          Arrastra aquí tu archivo Excel (.xlsx, .xls) o haz clic para seleccionarlo
          <div id="file-name2" class="text-truncate"></div>
        </div>
        <input id="fileInput2" type="file"
          accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"
          style="display:none">
      </div>
      <div>
        <div class="modal-body p-3">
          <div class="d-flex gap-3 justify-content-center">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="designType" id="checkAAPP" value="AAPP">
              <label class="form-check-label" for="checkAAPP">AAPP</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="designType" id="checkPAA" value="PAA">
              <label class="form-check-label" for="checkPAA">PAA</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <div class="d-flex flex-column gap-2 w-100 align-items-center justify-content-center">
          <button type="button" id="btnGeneraDesignessdgfp" class="btn btn-secondary btn-lg w-100">Genera
            Designes</button>
          <button type="button" id="btnGeneraCertificasdgfp" class="btn btn-secondary btn-lg w-100">Genera
            Certifica</button>
          <button type="button" id="btnGeneraMinutaDGFPSdgfp" class="btn btn-secondary btn-lg w-100">Genera Minuta
            SDGFP</button>

        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>


  (() => {
    const identFields = ["CONVOCATORIA / CONVOCATÒRIA (AAPP, FSE, PAA, etc.)", "ASESORÍA RESPONSABLE / ASSESSORIA RESPONSABLE", "CÓDIGO EDICIÓN / CODI EDICIÓ", "TÍTULO ACCIÓN FORMATIVA / TÍTOL ACCIÓ FORMATIVA", "NÚMERO HORAS TOTALES / Nº HORES TOTALS", "FECHAS REALIZACIÓN / DATES REALITZACIÓ", "MODALIDAD/MODALITAT (ON LINE/SEMIPRESENCIAL/PRESENCIAL)", "TIPO DE FORMACIÓN (CURSO / TALLER / JORNADA / CONGRESO)", "Nº PARTICIPANTES / NOMBRE PARTICIPANTS", "PRESUPUESTO / PRESSUPOST"];

    const intervFields = ["NOMBRE Y APELLIDOS o EMPRESA / NOM I COGNOMS o EMPRESA", "DNI / CIF", "JURÍDICO", "MINUTA / DIETA / FACTURA/ MATERIAL", "TIPO DE INTERVENCIÓN*/ TIPUS D'INTERVENCIÓ*", "UNIDADES/UNITATS", "Solo en caso de tutorización indicar Nº ALUMNOS/AS TUTORIZADOS", "TARIFICACIÓN APLICADA (€)", "IMPORTE / IMPORT (€)"];
    let extracted = null;


    let selectedFile = null;
    let currentAction = null;
    const dropzone2 = document.getElementById('dropzone2');
    const fileInput2 = document.getElementById('fileInput2');
    const fileNameEl2 = document.getElementById('file-name2');
    const buttons = {
      designes: document.getElementById('btnGeneraDesignessdgfp'),
      certifica: document.getElementById('btnGeneraCertificasdgfp'),
      minuta: document.getElementById('btnGeneraMinutaDGFPSdgfp'),
    };


    function cellText(ws, addr) {
      const c = ws[addr];
      if (!c || c.v === undefined || c.v === null) return '';
      return String(c.w ?? c.v).trim();
    }




    function extractData(workbook) {
      const ws = workbook.Sheets[workbook.SheetNames[0]];
      const identificativos = {};
      identFields.forEach((label, idx) => {
        identificativos[label] = cellText(ws, `D${idx + 11}`);
      });

      const parseEuroNumber = (v) => {
        if (v === null || v === undefined) return null;
        const s = String(v).trim();
        if (!s) return null;

        const normalized = s
          .replace(/\s*€\s*/gi, '')
          .replace(/\./g, '')
          .replace(',', '.')
          .replace(/[^\d.-]/g, '');

        const n = Number.parseFloat(normalized);
        return Number.isFinite(n) ? n : null;
      };

      identificativos["PRESUPUESTO / PRESSUPOST"] = parseEuroNumber(
        identificativos["PRESUPUESTO / PRESSUPOST"]
      );

      const intervinientes = [];
      for (let r = 23; r <= 1000; r++) {
        const rowVals = [];
        for (let c = 2; c <= 10; c++) {
          const addr = `${XLSX.utils.encode_col(c)}${r}`;
          const cell = ws[addr];
          // For IMPORTE field (last column, index 8), read raw numeric value
          if (c === 10) {
            if (!cell || cell.v === undefined || cell.v === null) {
              rowVals.push('');
            } else {
              // Prefer raw numeric value from cell
              const raw = cell.v;
              if (typeof raw === 'number') {
                rowVals.push(raw);
              } else {
                // fallback: parse string
                const s = String(cell.w ?? raw).trim()
                  .replace(/\s*€\s*/gi, '')
                  .replace(/\./g, '')
                  .replace(',', '.')
                  .replace(/[^\d.-]/g, '');
                const n = Number.parseFloat(s);
                rowVals.push(Number.isFinite(n) ? n : '');
              }
            }
          } else {
            rowVals.push(cellText(ws, addr));
          }
        }
        if (rowVals.every(v => v === '')) break;
        if (rowVals[0] === '') continue;
        intervinientes.push(Object.fromEntries(intervFields.map((k, i) => [k, rowVals[i]])));
      }



      return { identificativos, intervinientes };
    }


    function comprovafiledatos(file_comprova) {
      //alert("Comprovant");
      console.log('Archivo seleccionado:', file_comprova);
      const wb = XLSX.read(file_comprova, { type: 'array', cellDates: true });
      console.log('Archivo leído como workbook:', wb);
      extracted = extractData(wb);

      console.log('Datos extraídos:', extracted);

      // Validar que las horas totales coinciden con la suma de horas de intervinientes
      const errores = [];

      const parseNumber = (v) => {
        if (v === null || v === undefined) return 0;
        const s = String(v).trim()
          .replace(/\./g, '')      // miles
          .replace(',', '.')       // decimal
          .replace(/[^\d.-]/g, ''); // limpiar texto
        const n = parseFloat(s);
        return Number.isFinite(n) ? n : 0;
      };

      const normalize = (v) => (v || '')
        .toString()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .trim();

      const horasTotales = parseNumber(
        extracted?.identificativos?.["NÚMERO HORAS TOTALES / Nº HORES TOTALS"]
      );

      const sumaHorasIntervinientes = (extracted?.intervinientes || []).reduce((acc, it) => {
        return acc + parseNumber(it["UNIDADES/UNITATS"]);
      }, 0);

      if (Math.abs(horasTotales - sumaHorasIntervinientes) > 0.001) {
        errores.push('Las horas no cuadran.\nTotal en el Excel: ' + horasTotales + '\nSuma intervinientes: ' + sumaHorasIntervinientes);
      }

      // Validar que en modalidad presencial, al menos el 85% de las horas sean como ponente

      const modalidad = normalize(
        (extracted?.identificativos?.["MODALIDAD/MODALITAT (ON LINE/SEMIPRESENCIAL/PRESENCIAL)"] || '').toLowerCase()
      );

      if (modalidad === 'presencial') {
        const horasPonente = (extracted?.intervinientes || []).reduce((acc, it) => {
          const tipo = normalize(it["TIPO DE INTERVENCIÓN*/ TIPUS D'INTERVENCIÓ*"]);
          if (tipo.includes('PONENT')) {
            return acc + parseNumber(it["UNIDADES/UNITATS"]);
          }
          return acc;
        }, 0);

        const minimoPonente = horasTotales * 0.85;
        if (horasPonente + 0.001 < minimoPonente) {
          errores.push(
            'En modalidad presencial, al menos el 85% de las horas debe ser como ponente.\n' +
            'Horas totales: ' + horasTotales + '\n' +
            'Mínimo ponente (85%): ' + minimoPonente.toFixed(2) + '\n' +
            'Horas como ponente: ' + horasPonente
          );
        }
      }


      // Validar que si es semipresencial les hores de ponent sean entre el 84 y el 16% del total, y el resto síncronas o tutorización. (esto es un poco más complejo porque hay que permitir cierto margen de error en el cálculo de horas, pero se puede hacer)

      const esModalidadSemipresencial = modalidad.includes('SEMIPRESENCIAL');

      if (esModalidadSemipresencial) {
        const toleranciaHoras = Math.max(0.01, horasTotales * 0.005); // 0,5% o 0,01 h

        let horasPonent = 0;
        let horasRestoValidas = 0;
        const noPermitidos = [];

        (extracted?.intervinientes || []).forEach(it => {
          const tipo = normalize(it["TIPO DE INTERVENCIÓN*/ TIPUS D'INTERVENCIÓ*"]);
          const horas = parseNumber(it["UNIDADES/UNITATS"]);

          if (horas <= 0) return;

          if (tipo.includes('PONENT')) {
            horasPonent += horas;
            return;
          }

          if (tipo.includes('SINCRON') || tipo.includes('TUTORIZ')) {
            horasRestoValidas += horas;
            return;
          }

          noPermitidos.push(it);
        });

        const minimoPonent = horasTotales * 0.16;
        const maximoPonent = horasTotales * 0.84;

        if (horasPonent < minimoPonent - toleranciaHoras || horasPonent > maximoPonent + toleranciaHoras) {
          errores.push(
            'En modalidad semipresencial, las horas de ponente deben estar entre el 16% y el 84% del total.\n' +
            'Horas totales: ' + horasTotales + '\n' +
            'Mínimo ponente (16%): ' + minimoPonent.toFixed(2) + '\n' +
            'Máximo ponente (84%): ' + maximoPonent.toFixed(2) + '\n' +
            'Horas como ponente: ' + horasPonent
          );
        }

        const restoEsperado = horasTotales - horasPonent;
        if (Math.abs(restoEsperado - horasRestoValidas) > toleranciaHoras) {
          errores.push(
            'En modalidad semipresencial, las horas que no son de ponente deben ser síncronas o de tutorización.\n' +
            'Horas restantes esperadas: ' + restoEsperado.toFixed(2) + '\n' +
            'Horas síncronas/tutorización: ' + horasRestoValidas
          );
        }

        if (noPermitidos.length) {
          const detalle = noPermitidos.map(it => {
            const nombre = it["NOMBRE Y APELLIDOS o EMPRESA / NOM I COGNOMS o EMPRESA"] || '(sin nombre)';
            const horas = it["UNIDADES/UNITATS"] || '0';
            const tipo = it["TIPO DE INTERVENCIÓN*/ TIPUS D'INTERVENCIÓ*"] || '';
            return `- ${nombre} | ${horas} h | tipo: ${tipo}`;
          }).join('\n');

          errores.push(
            'En modalidad semipresencial, fuera de las horas de ponente solo se permiten horas síncronas o de tutorización.\n' +
            detalle
          );
        }
      }

      // Validar que si es online, on line o a distancia las horas de ponent son menos del 15% del total

      const esModalidadOnline = modalidad.includes('ONLINE') || modalidad.includes('ON LINE') || modalidad.includes('A DISTANCIA');

      if (esModalidadOnline) {
        const horasPonentOnline = (extracted?.intervinientes || []).reduce((acc, it) => {
          const tipo = normalize(it["TIPO DE INTERVENCIÓN*/ TIPUS D'INTERVENCIÓ*"]);
          if (tipo.includes('PONENT')) {
            return acc + parseNumber(it["UNIDADES/UNITATS"]);
          }
          return acc;
        }, 0);

        const maximoPonentOnline = horasTotales * 0.15;

        if (horasPonentOnline > maximoPonentOnline + 0.001) {
          errores.push(
            'En modalidad online/on line/a distancia, las horas de ponente deben ser inferiores al 15% del total.\n' +
            'Horas totales: ' + horasTotales + '\n' +
            'Máximo permitido (15%): ' + maximoPonentOnline.toFixed(2) + '\n' +
            'Horas como ponente: ' + horasPonentOnline
          );
        }
      }

      // Calcula que las horas totales dividido por el numero de días es menor que 8 en la modalidad presencial

      const esModalidadPresencial = modalidad.includes('PRESENCIAL');

      if (esModalidadPresencial) {
        const dias = parseNumber(extracted?.identificativos?.["NÚMERO DE DÍAS / NÚMERO DE DIES"]);
        if (dias > 0) {
          const horasPorDia = horasTotales / dias;
          if (horasPorDia > 8) {
            errores.push(
              'En modalidad presencial, no se pueden hacer más de 8 horas por día.\n' +
              'Horas totales: ' + horasTotales + '\n' +
              'Número de días: ' + dias + '\n' +
              'Horas por día: ' + horasPorDia.toFixed(2)
            );
          }
        }
      }


      // Comprueba que la suma de todos los "IMPORTE / IMPORT (€)" de los intervinientes sea exactamente igual al del "PRESUPUESTO / PRESSUPOST" indicado en los identificativos. Si no es igual, muestra un error indicando el importe total de los intervinientes, el presupuesto indicado y la diferencia.
      const presupuesto = parseNumber(
        extracted?.identificativos?.["PRESUPUESTO / PRESSUPOST"]
      );

      const totalImportesIntervinientes = (extracted?.intervinientes || []).reduce((acc, it) => {
        return acc + parseNumber(it["IMPORTE / IMPORT (€)"]);
      }, 0);

      const toCents = (n) => Math.round((Number(n) || 0) * 100);
      const diff = totalImportesIntervinientes - presupuesto;

      if (toCents(totalImportesIntervinientes) !== toCents(presupuesto)) {
        const fmt = (n) =>
          new Intl.NumberFormat('es-ES', {
            style: 'currency',
            currency: 'EUR'
          }).format(Number(n) || 0);

        errores.push(
          'El importe total de intervinientes no coincide con el presupuesto indicado.\n' +
          'Total intervinientes: ' + fmt(totalImportesIntervinientes) + '\n' +
          'Presupuesto indicado: ' + fmt(presupuesto) + '\n' +
          'Diferencia: ' + fmt(diff)
        );
      }






      // Calcula que las horas totales dividido por el numero de días es menor que 8 en la modalidad presencial


      if (esModalidadPresencial) {
        const dias = parseNumber(extracted?.identificativos?.["NÚMERO DE DÍAS / NÚMERO DE DIES"]);
        if (dias > 0) {
          const horasPorDia = horasTotales / dias;
          if (horasPorDia > 8) {
            errores.push(
              'En modalidad presencial, no se pueden hacer más de 8 horas por día.\n' +
              'Horas totales: ' + horasTotales + '\n' +
              'Número de días: ' + dias + '\n' +
              'Horas por día: ' + horasPorDia.toFixed(2)
            );
          }
        }
      }

      // Comprueba que el código de la edición concuerde con este patrón (r'^(25|26|27)FP\d{2}[A-Z]{2}\d{3}$', codigo):
      const codigoRaw =
        extracted?.identificativos?.["CÓDIGO EDICIÓN / CODI EDICIÓ"] ??
        extracted?.identificativos?.["CÓDIGO DE LA EDICIÓN / CÒDIGO DE L'EDICIÓ"] ??
        '';

      const codigo = String(codigoRaw).trim().toUpperCase();
      const patronCodigo = /^(26|27|28)[A-Z]{2}\d{2}[A-Z]{2}\d{3}$/;

      if (codigo && !patronCodigo.test(codigo)) {
        errores.push(
          'El código de la edición no coincide con el patrón esperado.\n' +
          'Código ingresado: ' + codigo + '\n' +
          'Formato esperado: año + 2 letras + 2 números + 2 letras + 3 números (ej: 27FP12AB345)'
        );
      }

      // Normaliza fechas: acepta "Del dd/MM/yyyy al dd/MM/yyyy" y también "dd/MM/yyyy al dd/MM/yyyy"
      const fechasRaw = extracted?.identificativos?.["FECHAS REALIZACIÓN / DATES REALITZACIÓ"];
      if (fechasRaw) {
        const txt = String(fechasRaw).trim();

        const conDel = /^Del\s+\d{2}\/\d{2}\/\d{4}\s+al\s+\d{2}\/\d{2}\/\d{4}$/i;
        const sinDel = /^(\d{2}\/\d{2}\/\d{4})\s+al\s+(\d{2}\/\d{2}\/\d{4})$/i;

        if (sinDel.test(txt) && !conDel.test(txt)) {
          const m = txt.match(sinDel);
          extracted.identificativos["FECHAS REALIZACIÓN / DATES REALITZACIÓ"] = `Del ${m[1]} al ${m[2]}`;
        }
      }

      const fechas = extracted?.identificativos?.["FECHAS REALIZACIÓN / DATES REALITZACIÓ"];
      if (fechas) {
        const patronFechas = /^Del\s+(\d{2}\/\d{2}\/\d{4})\s+al\s+(\d{2}\/\d{2}\/\d{4})$/i;
        const m = fechas.match(patronFechas);
        if (!m) {
          errores.push(
            'Las fechas de realización no tienen el formato correcto.\n' +
            'Fechas ingresadas: ' + fechas + '\n' +
            'Formato esperado: Del dd/MM/yyyy al dd/MM/yyyy'
          );
        } else {
          const parseFecha = (s) => {
            const [dia, mes, año] = s.split('/').map(Number);
            return new Date(año, mes - 1, dia);
          };
          const fechaInicio = parseFecha(m[1]);
          const fechaFin = parseFecha(m[2]);
          if (isNaN(fechaInicio.getTime()) || isNaN(fechaFin.getTime())) {
            errores.push(
              'Las fechas de realización contienen fechas no válidas.\n' +
              'Fechas ingresadas: ' + fechas
            );
          } else if (fechaInicio > fechaFin) {
            errores.push(
              'La fecha de inicio no puede ser posterior a la fecha de fin.\n' +
              'Fecha de inicio: ' + m[1] + '\n' +
              'Fecha de fin: ' + m[2]
            );
          }
        }
      }

      // Recopila todos los errores encontrados y muéstralos en un modal de Bootstrap. Si no hay errores, continúa con la generación del documento.

      if (errores.length) {
        alert('Se han encontrado los siguientes errores en el archivo:\n\n' + errores.join('\n\n'));

      }


    }

    async function setFile(file) {
      if (!file) return;
      const buffer = await file.arrayBuffer();
      selectedFile = file;
      fileNameEl2.textContent = file.name;
      const ok = comprovafiledatos(buffer);
    }

    // Drag & drop
    ['dragenter', 'dragover'].forEach(evt =>
      dropzone2.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropzone2.classList.add('dragover');
      })
    );
    ['dragleave', 'drop', 'dragend'].forEach(evt =>
      dropzone2.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropzone2.classList.remove('dragover');
      })
    );
    dropzone2.addEventListener('drop', e => {
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) setFile(f);
    });

    // Click to open file selector
    dropzone2.addEventListener('click', () => fileInput2.click());
    fileInput2.addEventListener('change', () => {
      const f = fileInput2.files && fileInput2.files[0];
      if (f) setFile(f);
    });

    // Upload helper
    async function uploadFor(action) {
      if (!selectedFile) {
        alert('Selecciona un archivo primero.');
        return;
      }
      // Map action to endpoint (ajusta rutas según backend)
      const endpoints = {
        designes: '/designessdgfp',
        certifica: '/certificasdgfp',
      };
      const url = endpoints[action];
      if (!url) return;

      // Disable UI
      // Object.values(buttons).forEach(b => b.disabled = true);
      const fd = new FormData();

      const designType = document.querySelector('input[name="designType"]:checked')?.value || '';
      fd.append('campana', designType);

      fd.append('file', selectedFile);

      try {
        // pedir como blob porque el backend puede devolver un fichero

        const resp = await axios.post(url, fd, {
          headers: { 'Content-Type': 'multipart/form-data' },
          responseType: 'blob'
        });

        const blob = resp.data;
        const contentType = (resp.headers && resp.headers['content-type']) || '';

        // función para cerrar modal y limpiar UI
        const cleanAndClose = (msg) => {
          selectedFile = null;
          fileInput.value = '';
          fileNameEl.textContent = '';
          const modalEl = document.getElementById('modalCreaDesignes');
          if (modalEl) {
            const bsModal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
            bsModal.hide();
          }
          if (msg) alert(msg);
        };

        if (contentType.includes('application/json')) {
          // el servidor devolvió JSON dentro del blob (mensaje de éxito/información)
          const text = await blob.text();
          let data;
          try { data = JSON.parse(text); } catch { data = { message: text }; }
          // cleanAndClose(data?.message || 'Operación completada');
        } else {
          // es un fichero: descargar
          const cd = (resp.headers && (resp.headers['content-disposition'] || resp.headers['Content-Disposition'])) || '';
          let filename = 'download';
          const m = cd.match(/filename\*?=(?:UTF-8'')?["']?([^;"']+)/i);
          if (m && m[1]) {
            try { filename = decodeURIComponent(m[1]); } catch { filename = m[1]; }
          } else if (selectedFile && selectedFile.name) {
            // sugerir nombre basado en archivo subido
            const base = selectedFile.name.replace(/\.[^.]+$/, '');
            filename = base + '_result';
          }

          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(blobUrl);

          //cleanAndClose('Fichero descargado');
        }
      } catch (err) {
        // intentar extraer mensaje de error si la respuesta incluye JSON en blob
        let msg = err?.message || 'Error en la subida';
        if (err?.response && err.response.data) {
          try {
            const errBlob = err.response.data;
            if (typeof errBlob.text === 'function') {
              const txt = await errBlob.text();
              try { msg = JSON.parse(txt)?.message || txt; } catch { msg = txt; }
            }
          } catch (e) { /* ignore */ }
        }
        alert(msg);
      } finally {
        Object.values(buttons).forEach(b => b.disabled = false);
      }
    }


    async function uploadForMinuta() {
      alert('La generació de minutes per la SDGFP es crea en Gesform.');
    }
    // Button clicks -> set action and upload
    buttons.designes.addEventListener('click', () => uploadFor('designes'));
    buttons.certifica.addEventListener('click', () => uploadFor('certifica'));
    buttons.minuta.addEventListener('click', () => uploadForMinuta());
  })();
</script>
